  <animateTransform attributeName="gradientTransform" type="rotate" values="0 295.0 210.0;360 295.0 210.0" dur="10s" repeatCount="indefinite"/>
</linearGradient>
<pattern id="puntosr" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#24305A"/></pattern>
<filter id="brilloR" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="2.5" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter></defs>

