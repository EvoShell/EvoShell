<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="590" height="420" viewBox="0 0 590 420" role="img" aria-label="Proyecto ERP empresarial en producción: usuarios, web en React 19, API en NestJS 12, PostgreSQL 18, Valkey 8 y S3. Módulos comercial, logística, finanzas y seguridad.">
<defs>
<linearGradient id="fondor" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#060914"/><stop offset="1" stop-color="#0E1430"/>
</linearGradient>
<linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="590" y2="0">
