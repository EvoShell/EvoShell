<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="452" viewBox="0 0 1200 452" role="img" aria-label="Desarrollador full stack. Área de sistemas · distribuidora comercial · Nariño, Colombia. Diseño, construyo y opero el ERP web que reemplazó sistemas heredados y hojas de cálculo. Módulos a mi cargo: Gestión comercial: cuotas e impactos, devoluciones, alcance por rol; Proveedores: informes y planos, ventas e inventario, comprobantes en PDF; Terceros: clientes y proveedores, acreedores y personal, catálogos contables; Bodega y distribución: planilla y bitácora, fletes y correrías, pago a transportadores; Plataforma: usuarios y roles, auditoría y monitoreo, infraestructura AWS. Stack: TypeScript · NestJS 12 · React 19 · PostgreSQL 18 · Valkey 8 · AWS.">
